name: "CI Check"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    runs-on: ["self-hosted", "Linux", "ubuntu-latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent) || true
          if [ -z "$STORE_PATH" ]; then
            echo "pnpm store path returned empty, using default"
            STORE_PATH="$HOME/.local/share/pnpm/store/v3_11"
          fi
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV
          echo "Detected pnpm store path: $STORE_PATH"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: pnpm lint
        run: pnpm lint
        working-directory: frontend

      - name: pnpm typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Check version is not already tagged
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Version in tauri.conf.json: $VERSION"

          # Validate semver format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo ""
            echo "============================================"
            echo "  ERROR: Version '$VERSION' is not valid semver."
            echo "  Expected format: X.Y.Z (e.g., 1.0.0)"
            echo "============================================"
            exit 1
          fi

          git fetch --tags

          if git tag -l "v${VERSION}" | grep -q .; then
            echo ""
            echo "============================================"
            echo "  ERROR: Tag v${VERSION} already exists!"
            echo "  Bump the version in tauri.conf.json"
            echo "  before merging this PR."
            echo "============================================"
            exit 1
          fi

          echo "Tag v${VERSION} does not exist — OK"
