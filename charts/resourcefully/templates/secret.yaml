{{- $fullName := include "resourcefully-kg.fullname" . -}}
{{- $hasExistingLightragSecret := and .Values.lightrag.apiKey .Values.lightrag.apiKey.existingSecret -}}
{{- $hasExistingNeo4jSecret := and .Values.neo4j.auth .Values.neo4j.auth.existingSecret -}}
{{- $hasExistingS3Secret := .Values.s3.existingSecret -}}

{{- if or (not $hasExistingLightragSecret) (not $hasExistingNeo4jSecret) (not $hasExistingS3Secret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  labels:
    {{- include "resourcefully-kg.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $hasExistingLightragSecret }}
  {{- $apiKey := .Values.lightrag.apiKey.value | default "CHANGE_ME_LIGHTRAG_API_KEY" }}
  lightrag-api-key: {{ $apiKey | b64enc | quote }}
  {{- end }}
  {{- if not $hasExistingNeo4jSecret }}
  {{- $neo4jUser := .Values.neo4j.auth.username | default "neo4j" }}
  {{- $neo4jPass := .Values.neo4j.auth.password | default "CHANGE_ME_NEO4J_PASSWORD" }}
  neo4j-auth: {{ printf "%s/%s" $neo4jUser $neo4jPass | b64enc | quote }}
  {{- end }}
  {{- if not $hasExistingS3Secret }}
  {{- $s3Key := .Values.s3.existingSecretAccessKeyId | default "CHANGE_ME_S3_ACCESS_KEY_ID" }}
  {{- $s3Secret := .Values.s3.existingSecretSecretAccessKey | default "CHANGE_ME_S3_SECRET_ACCESS_KEY" }}
  s3-access-key-id: {{ $s3Key | b64enc | quote }}
  s3-secret-access-key: {{ $s3Secret | b64enc | quote }}
  {{- end }}
{{- end }}
