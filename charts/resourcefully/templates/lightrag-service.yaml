apiVersion: v1
kind: Service
metadata:
  name: {{ include "resourcefully-kg.fullname" . }}-lightrag
  labels:
    {{- include "resourcefully-kg.labels" . | nindent 4 }}
    app.kubernetes.io/component: lightrag
spec:
  type: {{ .Values.lightrag.service.type }}
  ports:
    - port: {{ .Values.lightrag.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "resourcefully-kg.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lightrag
