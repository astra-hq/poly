apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poly-kg.fullname" . }}-lightrag-config
  labels:
    {{- include "poly-kg.labels" . | nindent 4 }}
data:
  # S3 blob storage configuration
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_USE_SSL: {{ .Values.s3.useSsl | quote }}
  # Neo4j connection
  NEO4J_URL: {{ printf "bolt://%s-neo4j:%d" (include "poly-kg.fullname" .) (int .Values.neo4j.service.boltPort) | quote }}
  # Embedding model
  LIGHTRAG_EMBEDDING_MODEL: {{ .Values.lightrag.embedding.model | quote }}
  LIGHTRAG_EMBEDDING_MODEL_NAME: {{ .Values.lightrag.embedding.modelName | quote }}
