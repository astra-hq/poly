### Poly Meeting Ontology Prompt Profile
### 
### This profile defines entity types and extraction examples tailored for
### Poly meeting summaries (technical discussions, action items, decisions).
### 
### When ENTITY_EXTRACTION_USE_JSON=true, the entity_extraction_json_examples
### section is used. When false, entity_extraction_examples is used.
### 
### Place this file at: PROMPT_DIR/entity_type/poly_meeting_ontology.yml
### And set ENTITY_TYPE_PROMPT_FILE=poly_meeting_ontology.yml

entity_types_guidance: |
  Classify each entity using one of the following types. If no type fits, use `Other`.

  - Product: Software products, platforms, applications, or services (e.g., Poly, Jira, VS Code, Slack)
  - Feature: Product capabilities, functionalities, or user-facing features (e.g., screen recording, transcription, knowledge graph)
  - AIModel: AI/ML models, model families, or model variants (e.g., Grounding DINO, Segment Anything, Qwen, Whisper, Parakeet)
  - Library: Software libraries, SDKs, frameworks, or packages (e.g., OCDNet, Deformable DETR, RT-DETR, PointPillars, PyTorch, TensorFlow)
  - Organization: Companies, research labs, open-source projects, or teams (e.g., NVIDIA, Meta, Google, Hugging Face)
  - Integration: Technical integrations, APIs, protocols, or interoperability mechanisms (e.g., knowledge graph integration, webhook, REST API)
  - Workflow: Processes, pipelines, or multi-step procedures (e.g., meeting ingestion pipeline, transcription workflow, CI/CD)
  - ActionItem: Concrete tasks assigned to owners with due dates (e.g., "Speaker: Evaluate PointPillars integration by Friday")
  - Decision: Explicit decisions made during the meeting (e.g., "Team decided to use Qwen3 for extraction")
  - Risk: Identified risks, concerns, or blockers (e.g., "VRAM limitation on 16GB GPUs", "model licensing uncertainty")
  - System: Infrastructure, hardware, or runtime environments (e.g., Docker, Ollama, Neo4j, GPU, RTX 4090)
  - Concept: Abstract concepts, methodologies, or technical approaches (e.g., mixture-of-experts, RAG, quantization, MoE)
  - Metric: Quantitative measurements, benchmarks, or performance indicators (e.g., "40 tok/s", "18 GB VRAM", "32k context")
  - Person: Human individuals mentioned by name or role (e.g., "Speaker", "Team lead", "Jeremi")
  - Meeting: Meeting identifiers, types, or recurring sessions (e.g., "standup", "sprint planning", "design review")

